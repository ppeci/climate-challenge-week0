name: CI

on:
  push:
    branches: [ "setup-task" ]
  pull_request:
    branches: [ "setup-task" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt